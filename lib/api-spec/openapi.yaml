openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: AI course generation from PDF
  - name: tutor
    description: AI tutor chat
  - name: progress
    description: Student progress tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses/generate:
    post:
      operationId: generateCourse
      tags: [courses]
      summary: Generate course from PDF text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCourseInput"
      responses:
        "200":
          description: Generated course structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCourse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /courses/saved:
    get:
      operationId: listSavedCourses
      tags: [courses]
      summary: List all published courses
      responses:
        "200":
          description: List of saved courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedCourse"
    post:
      operationId: publishCourse
      tags: [courses]
      summary: Publish and save a course to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCourseInput"
      responses:
        "201":
          description: Published course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCourse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /courses/saved/{id}:
    get:
      operationId: getSavedCourse
      tags: [courses]
      summary: Get a single saved course by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCourse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteSavedCourse
      tags: [courses]
      summary: Delete a saved course
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /tutor/chat:
    post:
      operationId: tutorChat
      tags: [tutor]
      summary: Chat with AI tutor using course context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorChatInput"
      responses:
        "200":
          description: SSE stream of AI tutor response
          content:
            text/event-stream: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /progress/{courseId}:
    get:
      operationId: getCourseProgress
      tags: [progress]
      summary: Get student progress for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of unit progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitProgress"
  /progress:
    put:
      operationId: saveProgress
      tags: [progress]
      summary: Save or update progress for a unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressInput"
      responses:
        "200":
          description: Saved progress record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitProgress"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateCourseInput:
      type: object
      properties:
        pdfText:
          type: string
          description: Extracted text content from the uploaded PDF
        filename:
          type: string
          description: Original filename of the uploaded PDF
      required:
        - pdfText
        - filename
    GeneratedUnit:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        objectives:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - summary
        - content
        - objectives
    GeneratedQuestion:
      type: object
      properties:
        id:
          type: integer
        unitId:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: string
      required:
        - id
        - unitId
        - question
        - options
        - correctIndex
        - explanation
    GeneratedCourse:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assessmentPlan:
          type: string
        units:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedUnit"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedQuestion"
      required:
        - title
        - description
        - assessmentPlan
        - units
        - questions
    PublishCourseInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assessmentPlan:
          type: string
        units:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedUnit"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedQuestion"
        pdfText:
          type: string
        filename:
          type: string
      required:
        - title
        - description
        - assessmentPlan
        - units
        - questions
        - pdfText
        - filename
    SavedCourse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        assessmentPlan:
          type: string
        units:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedUnit"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedQuestion"
        pdfText:
          type: string
        filename:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - assessmentPlan
        - units
        - questions
        - pdfText
        - filename
        - createdAt
    UnitProgress:
      type: object
      properties:
        unitId:
          type: integer
        completed:
          type: boolean
        score:
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
      required:
        - unitId
        - completed
    SaveProgressInput:
      type: object
      properties:
        courseId:
          type: integer
        unitId:
          type: integer
        completed:
          type: boolean
        score:
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
      required:
        - courseId
        - unitId
        - completed
    TutorChatInput:
      type: object
      properties:
        message:
          type: string
        courseTitle:
          type: string
        courseContext:
          type: string
          description: The full extracted PDF text to ground the tutor's answers
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - message
        - courseTitle
        - courseContext
        - history
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
      required:
        - role
        - content
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
